[data-theme=dark]{--bg:#1E2A38;--card:#263444;--tx:#F0F4F8;--tx2:#A0B2C6;--p:#64B6AC;--s:#3d8fa8;--bd:#34475b;--in:#1f2c3a;--sh:0 1px 2px #0003,0 10px 28px #0000002e;--hero:linear-gradient(135deg,#255f78 0%,#2f7f88 60%,#3f8f8a 100%);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Poppins,Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .4s,color .4s}

.app{display:flex;min-height:100vh;min-height:100dvh}
aside,.card,.top,.tabbar,.ic,.seg{transition:background .4s,border-color .4s,box-shadow .3s,transform .25s}
aside{width:260px;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:var(--card);border-inline-end:1px solid var(--bd);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:23px;color:var(--p);margin:0 8px 18px;letter-spacing:-.3px}
.logo i{width:40px;height:40px;border-radius:12px;background:var(--hero);color:#fff;display:grid;place-items:center;font-style:normal;font-size:22px;box-shadow:0 6px 16px #64b6ac66}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tx2);font-weight:600;font-size:14.5px;width:100%;text-align:start;transition:.2s}

.nv.on{background:var(--hero);color:#fff;box-shadow:0 8px 18px #176b8740}
.nv span{font-size:18px;width:28px;text-align:center}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--bg)}
.av{width:42px;height:42px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
main{flex:1;min-width:0;padding:26px clamp(14px,3vw,38px) 40px;max-width:1120px;margin-inline:auto}
.top{display:none}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:clamp(22px,4vw,28px);letter-spacing:-.4px}
h2{font-size:17px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sub{color:var(--tx2);font-size:13.5px}
.ctl{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px;height:38px}

.tt{position:relative;width:74px;height:38px;border-radius:99px;background:linear-gradient(135deg,#a9dcee,#e6f6fb);border:1px solid var(--bd);transition:background .5s;flex:none;overflow:hidden}
.tt:before,.tt:after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.8;transition:.5s}
.tt:before{width:16px;height:7px;inset-inline-end:10px;top:22px;border-radius:9px}
.tt:after{width:10px;height:5px;inset-inline-end:24px;top:10px;border-radius:9px}
[data-theme=dark] .tt{background:linear-gradient(135deg,#17202c,#2c3f56)}
[data-theme=dark] .tt:before,[data-theme=dark] .tt:after{width:3px;height:3px;border-radius:50%;background:#cfe4f5;inset-inline-start:14px;inset-inline-end:auto}
[data-theme=dark] .tt:after{inset-inline-start:30px;top:12px}
.tt .k{position:absolute;top:3px;inset-inline-start:3px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px #0003;transition:transform .5s cubic-bezier(.5,1.5,.4,1),background .4s;z-index:1}
[data-theme=dark] .tt .k{transform:translateX(36px);background:#dfe9f3}[dir=rtl][data-theme=dark] .tt .k{transform:translateX(-36px)}
.k em{font-style:normal;font-size:17px;display:block}.k em.sp{animation:spin .6s ease}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.card.h:hover{transform:translateY(-3px)}

.mt{margin-top:20px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:26px;position:relative;overflow:hidden;box-shadow:0 16px 36px #176b8740;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff1c}
.hero:before{width:220px;height:220px;inset-inline-end:-60px;top:-80px}.hero:after{width:120px;height:120px;inset-inline-end:120px;bottom:-60px}
.hero>*{position:relative;z-index:1}
.vit{position:relative;overflow:hidden}
.vit .e{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:21px;margin-bottom:10px}
.vit b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.pulse{animation:pulse 1.4s infinite}
.btn{background:var(--hero);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600;box-shadow:0 6px 16px #176b8740;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:0 10px 22px #176b8755;transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.o{background:var(--card);color:var(--p);border:1px solid var(--bd);box-shadow:none}
.btn.w{background:#fff;color:var(--p)}
.btn.r{background:var(--bad);box-shadow:0 6px 16px #e6394640}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:10px}
.ic{width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:14px;display:inline-grid;place-items:center}.ic:hover{transform:scale(1.12)}
.tag{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;background:#64b6ac26;color:var(--p);margin:3px}
.tag.w{background:#e6394620;color:var(--bad)}.tag.a{background:#f4a26126;color:#d17a1c}

.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.tl{border-inline-start:2px solid var(--bd);padding-inline-start:20px;display:grid;gap:18px;margin-inline-start:7px}
.tl>div{position:relative}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}

.inp:focus{border-color:var(--s);outline:0;box-shadow:0 0 0 4px #64b6ac33}

.pin{font-family:Poppins;font-size:34px;letter-spacing:8px;font-weight:700;color:var(--p)}
#toast{position:fixed;inset-inline:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.35s;transform:translateY(14px);z-index:60}
#toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:#0b1a2499;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:40;animation:fade .2s}
.modal .card{max-width:460px;width:100%;max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.big{width:84px;height:84px;border-radius:26px;margin:0 auto 16px;background:var(--hero);display:grid;place-items:center;font-size:42px;color:#fff;box-shadow:0 12px 30px #64b6ac66}
.empty{text-align:center;padding:22px 10px;color:var(--tx2)}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:var(--hero);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.brand:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#ffffff18;inset-inline-end:-140px;top:-140px}
.brand>*{position:relative}
.brand h1{font-size:clamp(30px,4vw,46px);line-height:1.15}
.ft{display:flex;gap:12px;align-items:center;background:#ffffff1f;border:1px solid #ffffff30;padding:12px 16px;border-radius:16px;backdrop-filter:blur(6px);font-weight:500;animation:fadeUp .6s both}
.form{display:grid;place-items:center;padding:24px;position:relative}
.form .in{width:100%;max-width:400px;text-align:center}
.corner{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:16px}
.tabbar{display:none}
.fx{animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes spin{from{transform:rotate(-200deg) scale(.4);opacity:0}}
@keyframes pulse{50%{transform:scale(1.25)}}
@media(max-width:900px){.brand{display:none}.auth{grid-template-columns:1fr}}
@media(max-width:820px){
aside,.dk{display:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:6}
.top .logo{margin:0;font-size:20px}.top .logo i{width:34px;height:34px;font-size:18px}
.tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabbar button{flex:1 0 66px;color:var(--tx2);font-size:11px;font-weight:600;padding:6px 2px;border-radius:12px;display:grid;gap:2px;justify-items:center}
.tabbar button span{font-size:20px}.tabbar .on{color:var(--p);background:var(--bg)}
main{padding-bottom:100px}
}
@media(min-width:821px) and (max-width:1100px){aside{width:220px}main{padding-inline:22px}}
@media(max-width:480px){.hero{padding:20px}.card{padding:16px;border-radius:18px}.pin{font-size:28px;letter-spacing:5px}.g2{grid-template-columns:1fr}}
@media(hover:none){.card.h:hover,.qa:hover,.btn:hover,.nv:hover{transform:none}.ic{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const TTL={meds:['Medication','دواء'],alg:['Allergy','حساسية'],cond:['Condition','حالة'],hx:['History item','حدث'],ap:['Appointment','موعد'],labs:['Lab result','نتيجة تحليل'],vis:['Consultation','زيارة'],v:['Vital signs','العلامات الحيوية'],prof:['Profile','الملف الشخصي']};
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.remove())}
function openForm(c,i){const sch=SCH[c](),single=c==='v'||c==='prof',old=single?S[c==='v'?'v':'']||S:S[c][i]||{};const src=c==='v'?S.v:c==='prof'?S:(i>=0?S[c][i]:{});
const fld=sch.map((f,k)=>{const val=String(T(src[f[0]]??''));let el;
if(Array.isArray(f[2]))el=`<select class="inp" id="f${k}">${f[2].map(o=>`<option value="${o[0]}" ${o[0]===src[f[0]]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
else if(f[2]==='area')el=`<textarea class="inp" id="f${k}" rows="3">${val}</textarea>`;
else el=`<input class="inp" id="f${k}" type="${f[2]||'text'}" value="${val.replace(/"/g,'&quot;')}">`;
return `<label class="f">${f[1]}${el}</label>`}).join('');
const m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target===m)closeM()};
const t=TTL[c];m.innerHTML=`<div class="card"><div class="ch"><h2>${i>=0||single?L('Edit ','تعديل '):L('Add ','إضافة ')}${L(t[0],t[1])}</h2><button class="ic" onclick="closeM()" aria-label="Close">✕</button></div>${fld}<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn o" onclick="closeM()">${L('Cancel','إلغاء')}</button><button class="btn" onclick="saveForm('${c}',${i})">${L('Save','حفظ')}</button></div></div>`;
document.body.appendChild(m);const f=m.querySelector('input,select,textarea');if(f)f.focus()}
function saveForm(c,i){const sch=SCH[c](),single=c==='v'||c==='prof';let tgt=c==='v'?S.v:c==='prof'?S:(i>=0?S[c][i]:{});
sch.forEach((f,k)=>{const v=document.getElementById('f'+k).value.trim();if(v!==String(T(tgt[f[0]]??'')))tgt[f[0]]=v});
if(!single&&i<0){if(!(tgt.n||tgt.t||tgt.dr||tgt.y))return toast(L('Please fill in the details','أكمل البيانات'));if(c==='ap'||c==='hx'||c==='labs'||c==='vis')S[c].unshift(tgt);else S[c].push(tgt)}
if(c==='labs'&&!tgt.s)tgt.s='ok';save();closeM();toast(L('Saved successfully','تم الحفظ'));render()}
function delI(c,i){S[c].splice(i,1);save();toast(L('Deleted','تم الحذف'));render()}
const rb=(c,i)=>`<button class="ic" onclick="openForm('${c}',${i})" aria-label="Edit">✏️</button> <button class="ic" onclick="delI('${c}',${i})" aria-label="Delete">🗑️</button>`;
const addB=(c,l)=>`<button class="btn sm" onclick="openForm('${c}',-1)">＋ ${l}</button>`;
const hd=(t,x='')=>`<div class="ch"><h2>${t}</h2>${x}</div>`;
const empty=t=>`<div class="empty">${t}</div>`;
const stat=s=>`<span class="bd ${s==='ok'?'n':'x'}">${s==='ok'?L('Normal','طبيعي'):L('Requires attention','يحتاج متابعة')}</span>`;
const tags=(c,cls)=>S[c].length?S[c].map((x,i)=>`<span class="tag ${cls}"><span onclick="openForm('${c}',${i})" style="cursor:pointer">${T(x.n)}</span><button onclick="delI('${c}',${i})" aria-label="Delete">✕</button></span>`).join(''):`<span class="sub">${L('Nothing added yet','لا يوجد بعد')}</span>`;

<div class="card">${hd(L('Preferences & security','التفضيلات والأمان'))}<div class="row"><span>🔐 ${L('Two-factor authentication','التحقق بخطوتين')}</span><button class="chip ${twofa?'on':''}" onclick="twofa=!twofa;render()">${twofa?L('On','مفعل'):L('Off','متوقف')}</button></div><div class="row"><span>🌗 ${L('Eye comfort mode','وضع راحة العين')}</span>${sw()}</div><div class="row"><span>🌐 ${L('Language','اللغة')}</span><div class="tabs" style="margin:0"><button class="chip ${lang==='en'?'on':''}" onclick="setL('en')">English</button><button class="chip ${lang==='ar'?'on':''}" onclick="setL('ar')">العربية</button></div></div><div class="row"><span>👥 ${L('Switch role','تبديل الدور')}</span><button class="chip" onclick="swRole()">${role==='doctor'?L('Patient view','عرض المريض'):L('Doctor view','عرض الطبيب')}</button></div><div class="row"><span>♻️ ${L('Reset demo data','إعادة البيانات')}</span><button class="chip" onclick="S=DEF();save();toast(L('Data reset','تمت الإعادة'));render()">${L('Reset','إعادة')}</button></div><button class="btn r" style="margin-top:16px;width:100%" onclick="out()">${L('Sign out','تسجيل الخروج')}</button></div></div>`,
doctor:()=>`<div class="card">${hd(L('Patient lookup','البحث عن مريض'))}<div style="display:flex;gap:10px;flex-wrap:wrap"><input class="inp" style="flex:1;min-width:200px;margin:0" id="lk" inputmode="numeric" maxlength="6" placeholder="${L('Enter 6-digit code','أدخل رمز من 6 أرقام')}"><button class="btn" onclick="lookup()">${L('Open record','عرض')}</button><button class="btn o" onclick="scanQR()">📷 ${L('Scan QR','مسح QR')}</button></div></div>
${doc?`<div class="fx"><p class="sub mt">🔓 ${L('Access code','رمز الوصول')} <b>${doc}</b> ${L('accepted. Demo data shown.','مقبول. بيانات تجريبية.')}</p><div class="card warn mt"><h2>⚠️ ${L('Alert: ','تنبيه: ')}${S.alg.map(a=>T(a.n)).join(', ')||'-'}</h2><p class="sub" style="margin-top:6px">${L('Critical note: asthma, needs rescue inhaler.','ملاحظة حرجة: ربو يحتاج بخاخ طوارئ.')}</p></div><div class="g g2 mt"><div class="card">${hd(S.pn+', '+S.age)}<span class="tag">${S.bg}</span>${S.cond.map(c=>`<span class="tag">${T(c.n)}</span>`).join('')}${S.meds.slice(0,3).map(m=>`<div class="row"><b>💊 ${T(m.n)}</b><span class="sub">${T(m.d)}</span></div>`).join('')}</div><div class="card">${hd(L('Recent labs','آخر التحاليل'))}${S.labs.slice(0,3).map(r=>`<div class="row"><span>${T(r.n)}</span>${stat(r.s)}</div>`).join('')}</div></div><div class="card mt">${hd(L('Doctor note','ملاحظة الطبيب'))}<textarea class="inp" rows="3" style="margin:0 0 12px" placeholder="${L('Write your note...','اكتب ملاحظتك...')}"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="toast(L('Note saved','تم حفظ الملاحظة'))">${L('Save note','حفظ الملاحظة')}</button><button class="btn o" onclick="toast(L('Lab request sent','تم إرسال الطلب'))">🧪 ${L('Request lab','طلب تحليل')}</button></div></div></div>`:`<div class="card mt empty"><div class="big" style="background:var(--bg);color:var(--p);box-shadow:none">👨‍⚕️</div>${L('Enter a patient code to see the authorized record. Try any 6 digits.','أدخل رمز المريض لعرض السجل. جرب أي 6 أرقام.')}</div>`}`};
function qr(seed){let s=+seed||1,n=25,o='';const r=()=>(s=(s*1103515245+12345)%2147483648)/2147483648,P=[[0,0],[n-7,0],[0,n-7]],fp=(x,y)=>P.find(p=>x>=p[0]&&x<p[0]+7&&y>=p[1]&&y<p[1]+7);
for(let y=0;y<n;y++)for(let x=0;x<n;x++){const p=fp(x,y);let on=p?Math.max(Math.abs(x-p[0]-3),Math.abs(y-p[1]-3))!==2:r()>.52;if(on)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
return `<svg viewBox="-1 -1 27 27" width="200" height="200" style="background:#fff;padding:8px;border-radius:16px;border:1px solid var(--bd)" fill="#176B87" shape-rendering="crispEdges">${o}</svg>`}
const BASE='https://maryam555654.github.io/Healio/';
const lnk=p=>BASE+'#doctor-'+p;
function qrMods(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q}catch(e){return null}}
function qrView(p){const q=qrMods(lnk(p));if(!q)return `<div class="empty">${L('QR needs an internet connection. Use the code below.','يحتاج QR إنترنت. استخدم الرمز بالأسفل.')}</div>`;const n=q.getModuleCount();let o='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))o+=`<rect x="${c}" y="${r}" width="1" height="1"/>`;return `<svg viewBox="-2 -2 ${n+4} ${n+4}" width="230" height="230" style="background:#fff;border-radius:16px;max-width:100%;border:1px solid var(--bd)" fill="#0f4f66" shape-rendering="crispEdges" role="img" aria-label="QR code">${o}</svg>`}
function deep(){const m=location.hash.match(/^#doctor-(\d{6})$/);if(!m)return false;role='doctor';authed=true;page='doctor';doc=m[1];fx=true;return true}
async function shareLink(){const u=lnk(pin);try{if(navigator.share){await navigator.share({title:'Healio',url:u});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(u);toast(L('Link copied','تم نسخ الرابط'));return}catch(e){}const m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target===m)closeM()};m.innerHTML=`<div class="card"><div class="ch"><h2>🔗 ${L('Share link','رابط المشاركة')}</h2><button class="ic" onclick="closeM()" aria-label="Close">✕</button></div><input class="inp" readonly value="${u}" onfocus="this.select()" onclick="this.select()"></div>`;document.body.appendChild(m)}
async function scanQR(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return toast(L('Use your phone camera app to scan the QR','استخدم كاميرا الموبايل لمسح الـ QR'));try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><div class="ch"><h2>📷 ${L('Scan QR','مسح QR')}</h2><button class="ic" onclick="closeM()" aria-label="Close">✕</button></div><video id="cam" playsinline muted style="width:100%;border-radius:14px"></video></div>`;document.body.appendChild(m);const v=$('#cam');v.srcObject=st;await v.play();const d=new BarcodeDetector({formats:['qr_code']});const stop=()=>st.getTracks().forEach(t=>t.stop());const tick=async()=>{if(!document.body.contains(m))return stop();try{const r=await d.detect(v);const f=r.map(x=>x.rawValue.match(/(\d{6})\s*$/)).find(Boolean);if(f){stop();closeM();doc=f[1];render();return}}catch(e){}requestAnimationFrame(tick)};tick()}catch(e){toast(L('Camera unavailable. Type the code instead.','الكاميرا غير متاحة. اكتب الرمز.'))}}
function mkShare(){pin=String(Math.floor(100000+Math.random()*900000));shares.unshift(pin);toast(L('Share code created','تم إنشاء الرمز'));render()}
function lookup(scan){const v=scan?'123456':($('#lk').value||'').trim();if(/^\d{6}$/.test(v)){doc=v;fx=true;render()}else toast(L('Enter 6 digits','أدخل 6 أرقام'))}
function preview(i){const r=S.labs[i],m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target===m)closeM()};m.innerHTML=`<div class="card"><div class="ch"><h2>📄 ${T(r.n)}</h2><button class="ic" onclick="closeM()" aria-label="Close">✕</button></div><p class="sub">${r.dt}</p><div class="row"><span>${L('Result','النتيجة')}</span>${stat(r.s)}</div><p style="margin:14px 0">${L('Demo data to show the report layout.','بيانات تجريبية لعرض شكل التقرير.')}</p><button class="btn" onclick="closeM()">${L('Close','إغلاق')}</button></div>`;document.body.appendChild(m)}
function render(){apply();const R=$('#root');
if(!authed){R.innerHTML=authView();return}
const N=role==='doctor'?DNAV():NAV();if(!PAGES[page]||!N.find(n=>n[0]===page))page=N[0][0];
const cur=N.find(n=>n[0]===page);
R.innerHTML=`<div class="top">${logo}${ctl()}</div><div class="app"><aside>${logo}${N.map(n=>`<button class="nv ${n[0]===page?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}<div class="me"><div class="av">${nm().trim()[0]||'U'}</div><div style="min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nm()}</b><div class="sub">${role==='doctor'?L('Doctor','طبيب'):L('Patient','مريض')}</div></div></div></aside><main><div class="bar"><h1>${cur[2]}</h1><div class="dk">${ctl()}</div></div><div class="${fx?'fx':''}">${PAGES[page]()}</div></main></div><nav class="tabbar">${N.map(n=>`<button class="${n[0]===page?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`;fx=false}
addEventListener('hashchange',()=>{if(deep()){render();return}const h=location.hash.slice(1);if(authed&&PAGES[h]&&h!==page){page=h;fx=true;render()}});
deep();apply();render();
</script>
</body>
</html>
